<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Void Incremental</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ============================
       TOP NAV / TABS
       ============================ -->
  <div id="top-bar">
    <button class="tab-btn active" data-tab="skills">Skills</button>
    <button class="tab-btn" data-tab="jobs">Entities</button>
    <button class="tab-btn" data-tab="void">Void</button>
    <button class="tab-btn" data-tab="shop">Shop</button>
    <button class="tab-btn" data-tab="prestige">Prestige</button>
  </div>


  <!-- ============================
       TABS
       ============================ -->

  <!-- Skills -->
  <div id="tab-skills" class="tab active">
    <h2>Skills</h2>
    <div id="skills-container"></div>
  </div>

  <!-- Jobs / Entities -->
  <div id="tab-jobs" class="tab">
    <h2>Entities</h2>
    <div id="jobs-container"></div>
  </div>

  <!-- Void -->
  <div id="tab-void" class="tab">
    <h2>Void</h2>
    <div id="void-actions"></div>
  </div>

  <!-- Shop -->
  <div id="tab-shop" class="tab">
    <h2>Shop</h2>

    <h3>Resource Upgrades</h3>
    <div id="shop-resource"></div>

    <h3>Void Upgrades</h3>
    <div id="shop-void"></div>

    <h3>Ascend Upgrades</h3>
    <div id="shop-ascend"></div>

    <h3>Transcend Upgrades</h3>
    <div id="shop-transcend"></div>

    <h3>Eternal Upgrades</h3>
    <div id="shop-eternal"></div>
  </div>

  <!-- Prestige -->
  <div id="tab-prestige" class="tab">
    <h2>Prestige</h2>

    <div class="prestige-block">
      <div id="ascend-info">Ascendant Shards: 0</div>
      <button id="ascend-btn">Ascend</button>
    </div>

    <div class="prestige-block">
      <div id="transcend-info">Transcendent Essence: 0</div>
      <button id="transcend-btn">Transcend</button>
    </div>

    <div class="prestige-block">
      <div id="eternal-info">Eternal Embers: 0</div>
      <button id="eternal-btn">Eternal</button>
    </div>
  </div>


  <!-- ============================
       LOG PANEL
       ============================ -->
  <div id="log"></div>


  <!-- ============================
       HIRE MODAL (Created by JS)
       ============================ -->
  <!-- JS will inject #hire-modal here -->


  <!-- ============================
       ERUDA DEBUG CONSOLE
       ============================ -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    // Initialize Eruda after page loads
    document.addEventListener("DOMContentLoaded", () => {
      eruda.init();
      console.log("Eruda console loaded.");
    });
  </script>


  <!-- ============================
       GAME SCRIPTS
       ============================ -->
  <script src="elements.js"></script>
  <script src="state.js"></script>
  <script src="skillDefs.js"></script>
  <script src="entityGenerator.js"></script>
  <script src="skills.js"></script>
  <script src="jobs.js"></script>
  <script src="void.js"></script>
  <script src="shopDefs.js"></script>
  <script src="shop.js"></script>
  <script src="prestige.js"></script>
  <script src="ui.js"></script>
  <script src="tick.js"></script>
  <script src="main.js"></script>


  <script>
  console.log("INDEX: reached end of HTML, scripts should be loaded.");
  console.log("INDEX: typeof buildUI =", typeof buildUI);
  console.log("INDEX: typeof startGame =", typeof startGame);
</script>

</body>
</html>
