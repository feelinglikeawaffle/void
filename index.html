<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feeding the Void</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header>
    <div>
      <h1>FEEDING THE VOID</h1>
      <div class="sub">A tiny incremental about bars, entropy, and cosmic hunger.</div>
    </div>
    <div class="sub" id="time-display">t=0s</div>
  </header>

  <div id="void-panel">
    <div>
      <div id="void-name">THE HUNGRY VOID</div>
      <div>Void Favor: <span id="void-favor-value">0</span></div>
      <div>Global Multiplier: <span id="void-mult-value">x1.00</span></div>
    </div>
    <div>
      <button id="feed-void-btn">Feed the Void (Dust)</button>
      <div style="font-size:0.75rem;color:var(--muted);">
        Dust: <span id="dust-count">0</span> • Fragments: <span id="fragment-count">0</span>
      </div>
    </div>
  </div>

  <div id="tabs">
    <button class="tab-btn active" data-tab="skills">Skills</button>
    <button class="tab-btn" data-tab="jobs">Jobs</button>
    <button class="tab-btn locked" data-tab="void">Void</button>
  </div>

  <div id="tab-skills" class="tab active">
    <div class="section-title">Training the Vessel</div>
    <div id="skills-container"></div>
  </div>

  <div id="tab-jobs" class="tab">
    <div class="section-title">Work for the Void</div>
    <div id="jobs-container"></div>
  </div>

  <div id="tab-void" class="tab">
    <div class="section-title">Feeding Rituals</div>
    <label><input type="checkbox" id="auto-void-toggle"> Auto‑Feed the Void</label>
    <div id="void-actions"></div>
  </div>

  <div id="log"></div>

  <div id="footer">
    <button id="save-btn">Save</button>
    <button id="load-btn">Load</button>
    <button id="wipe-btn" class="danger">Wipe Save</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
