<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Void Incremental</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ============================
       TOP NAV / TABS + SAVE/LOAD
       ============================ -->
  <div id="top-bar">
    <button class="tab-btn active" data-tab="skills">Skills</button>
    <button class="tab-btn" data-tab="jobs">Entities</button>
    <button class="tab-btn" data-tab="void">Void</button>
    <button class="tab-btn" data-tab="shop">Shop</button>
    <button class="tab-btn" data-tab="prestige">Prestige</button>

    <!-- Added for Option B -->
    <button id="save-btn">Save</button>
    <button id="load-btn">Load</button>
  </div>


  <!-- ============================
       TABS
       ============================ -->

  <!-- Skills -->
  <div id="tab-skills" class="tab active">
    <h2>Skills</h2>
    <div id="skills-container"></div>
  </div>

  <!-- Jobs / Entities -->
  <div id="tab-jobs" class="tab">
    <h2>Entities</h2>
    <div id="jobs-container"></div>
  </div>

  <!-- Void -->
  <div id="tab-void" class="tab">
    <h2>Void</h2>
    <div id="void-actions"></div>
  </div>

  <!-- Shop -->
  <div id="tab-shop" class="tab">
    <h2>Shop</h2>

    <h3>Resource Upgrades</h3>
    <div id="shop-resource"></div>

    <h3>Void Upgrades</h3>
    <div id="shop-void"></div>

    <h3>Ascend Upgrades</h3>
    <div id="shop-ascend"></div>

    <h3>Transcend Upgrades</h3>
    <div id="shop-transcend"></div>

    <h3>Eternal Upgrades</h3>
    <div id="shop-eternal"></div>
  </div>

  <!-- Prestige -->
  <div id="tab-prestige" class="tab">
    <h2>Prestige</h2>

    <div class="prestige-block">
      <div id="ascend-info">Ascendant Shards: 0</div>
      <button id="ascend-btn">Ascend</button>
    </div>

    <div class="prestige-block">
      <div id="transcend-info">Transcendent Essence: 0</div>
      <button id="transcend-btn">Transcend</button>
    </div>

    <div class="prestige-block">
      <div id="eternal-info">Eternal Embers: 0</div>
      <button id="eternal-btn">Eternal</button>
    </div>
  </div>


  <!-- ============================
       LOG PANEL
       ============================ -->
  <div id="log"></div>


  <!-- ============================
       HIRE MODAL (Created by JS)
       ============================ -->
  <!-- JS will inject #hire-modal here -->


  <!-- ============================
       ERUDA DEBUG CONSOLE
       ============================ -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      eruda.init();
      console.log("ERUDA: Console initialized.");
    });
  </script>

  <!-- ============================
       GLOBAL ERROR TRAP
       ============================ -->
  <script>
    window.onerror = function (msg, src, line, col, err) {
      console.error("GLOBAL ERROR:", msg, "at", src + ":" + line + ":" + col);
    };
  </script>

  <!-- ============================
       GAME SCRIPTS (corrected paths)
       ============================ -->
  <script src="js/elements.js"></script>
  <script src="js/state.js"></script>
  <script src="js/skillDefs.js"></script>
  <script src="js/entityGenerator.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/void.js"></script>
  <script src="js/shopDefs.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/prestige.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tick.js"></script>
  <script src="js/main.js"></script>

  <!-- ============================
       SCRIPT LOAD DETECTOR
       ============================ -->
  <script>
    const expectedScripts = [
      "js/elements.js","js/state.js","js/skillDefs.js","js/entityGenerator.js",
      "js/skills.js","js/jobs.js","js/void.js","js/shopDefs.js","js/shop.js",
      "js/prestige.js","js/ui.js","js/tick.js","js/main.js"
    ];

    expectedScripts.forEach(name => {
      const tag = document.querySelector(`script[src="${name}"]`);
      if (!tag) {
        console.error("SCRIPT TAG MISSING:", name);
      } else {
        tag.addEventListener("error", () => {
          console.error("FAILED TO LOAD SCRIPT:", name);
        });
      }
    });

    console.log("INDEX: Script loader detector active.");
  </script>

</body>
</html>
