<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feeding the Void</title>
<style>
/* --- STYLES UNCHANGED FROM PREVIOUS VERSION (TRIMMED FOR BREVITY) --- */
:root {
  --bg: #050510;
  --bg-alt: #0b0b1a;
  --panel: #111122;
  --accent: #8b5cf6;
  --accent-soft: rgba(139,92,246,0.25);
  --accent-strong: #a855f7;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --danger: #f97373;
  --bar-bg: #1f2933;
  --bar-fill: linear-gradient(90deg,#8b5cf6,#ec4899);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:radial-gradient(circle at top,#111827 0,#02010a 45%,#000 100%);
  color:var(--text);
}
#app{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
header h1{font-size:1.4rem;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--accent-strong)}
header .sub{font-size:.8rem;color:var(--muted)}
#void-panel{
  background:radial-gradient(circle at center,#111827 0,#02010a 60%);
  border-radius:10px;padding:10px 14px;margin-bottom:10px;
  border:1px solid rgba(148,163,184,0.25);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
#tabs{display:flex;gap:6px;margin-bottom:10px;border-bottom:1px solid rgba(148,163,184,0.25)}
.tab-btn{padding:6px 10px;font-size:.8rem;border:none;border-radius:6px 6px 0 0;background:transparent;color:var(--muted);cursor:pointer}
.tab-btn.active{background:var(--panel);color:var(--text);border:1px solid rgba(148,163,184,0.4);border-bottom:none}
.tab-btn.locked{opacity:.4;cursor:default}
.tab{display:none;background:var(--panel);border-radius:0 8px 8px 8px;border:1px solid rgba(148,163,184,0.4);padding:10px;min-height:260px}
.tab.active{display:block}
.section-title{font-size:.9rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px;padding:6px;background:rgba(15,23,42,0.7);border-radius:6px;margin-bottom:4px}
.row-header{display:flex;justify-content:space-between;width:100%;font-size:.8rem;margin-bottom:2px}
.row-name{font-weight:600}
.row-meta{color:var(--muted);font-size:.75rem}
.bar-container{position:relative;width:100%;height:14px;border-radius:999px;background:var(--bar-bg);overflow:hidden}
.bar-fill{position:absolute;top:0;left:0;height:100%;width:0%;background-image:var(--bar-fill);transition:width .08s linear}
.bar-label{position:absolute;width:100%;text-align:center;font-size:.7rem;color:#e5e7eb;mix-blend-mode:screen}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:110px}
.small-btn{padding:3px 7px;font-size:.7rem;border-radius:999px;border:1px solid rgba(148,163,184,0.6);background:rgba(15,23,42,0.9);color:var(--text);cursor:pointer}
.small-btn:disabled{opacity:.4;cursor:default}
.small-label{font-size:.7rem;color:var(--muted)}
.floating-text{
  position:fixed;pointer-events:none;font-size:.75rem;color:var(--accent-strong);
  opacity:0;transform:translateY(0);
  transition:transform .6s ease-out,opacity .6s ease-out;z-index:9999;
}
</style>
</head>
<body>
<div id="app">

<header>
  <div>
    <h1>FEEDING THE VOID</h1>
    <div class="sub">Fast‑leveling Progress Knight–style incremental.</div>
  </div>
  <div class="sub" id="time-display">t=0s</div>
</header>

<div id="void-panel">
  <div>
    <div style="font-size:.9rem;color:var(--muted)">THE HUNGRY VOID</div>
    <div>Void Favor: <span id="void-favor-value">0</span></div>
    <div style="font-size:.8rem;color:var(--muted)">Global Multiplier: <span id="void-mult-value">x1.00</span></div>
  </div>
  <div>
    <button id="feed-void-btn">Feed the Void (Dust)</button>
    <div style="font-size:.75rem;color:var(--muted)">
      Dust: <span id="dust-count">0</span> • Fragments: <span id="fragment-count">0</span>
    </div>
  </div>
</div>

<div id="tabs">
  <button class="tab-btn active" data-tab="skills">Skills</button>
  <button class="tab-btn" data-tab="jobs">Jobs</button>
  <button class="tab-btn locked" data-tab="void">Void</button>
  <button class="tab-btn locked" data-tab="prestige">Collapse</button>
</div>

<div id="tab-skills" class="tab active">
  <div class="section-title">Training the Vessel</div>
  <div id="skills-container"></div>
</div>

<div id="tab-jobs" class="tab">
  <div class="section-title">Work for the Void</div>
  <div id="jobs-container"></div>
</div>

<div id="tab-void" class="tab">
  <div class="section-title">Feeding Rituals</div>
  <div id="void-actions"></div>
</div>

<div id="tab-prestige" class="tab">
  <div class="section-title">Collapse Reality</div>
  <p style="font-size:.8rem;color:var(--muted)">Prestige not implemented yet.</p>
</div>

<div id="log"></div>

<script>
/* ============================================================
   FAST‑LEVELING VERSION — Progress Knight style
   ============================================================ */

const TICK = 50;
let state = {
  time: 0,
  dust: 0,
  fragments: 0,
  voidFavor: 0,
  skills: {},
  jobs: {},
  unlocks: { jobs: false, void: false }
};

/* ---------------- SKILL DEFINITIONS ---------------- */
const skillDefs = [
  { id:"focus", name:"Focus", baseDuration:2000, xpPer:5 },
  { id:"voidsense", name:"Void Sensitivity", baseDuration:2500, xpPer:5 },
  { id:"meditation", name:"Meditation", baseDuration:3000, xpPer:5 }
];

/* ---------------- JOB DEFINITIONS ---------------- */
const jobDefs = [
  { id:"dust", name:"Dust Gatherer", baseDuration:2500, reward:1, req:{skill:"focus",lvl:1} },
  { id:"fragments", name:"Fragment Sifter", baseDuration:3500, reward:1, req:{skill:"voidsense",lvl:2} }
];

/* ---------------- INITIALIZE ---------------- */
function init() {
  skillDefs.forEach(s => state.skills[s.id] = { level:0, xp:0, progress:0 });
  jobDefs.forEach(j => state.jobs[j.id] = { level:0, progress:0 });
}
init();

/* ---------------- MULTIPLIERS ---------------- */
function voidMult() { return 1 + state.voidFavor * 0.02 }

/* ---------------- FLOATING TEXT ---------------- */
function floatText(txt, rect, color="#a855f7") {
  const el = document.createElement("div");
  el.className = "floating-text";
  el.textContent = txt;
  el.style.left = rect.left + rect.width/2 + "px";
  el.style.top = rect.top + rect.height/2 + "px";
  el.style.color = color;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity=1; el.style.transform="translateY(-20px)" });
  setTimeout(()=>{ el.style.opacity=0; el.style.transform="translateY(-40px)" },400);
  setTimeout(()=>el.remove(),800);
}

/* ---------------- UI BUILD ---------------- */
const skillBox = document.getElementById("skills-container");
const jobBox = document.getElementById("jobs-container");

function makeRow(def, type) {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `
    <div style="flex:1">
      <div class="row-header">
        <div class="row-name">${def.name}</div>
        <div class="row-meta" id="${def.id}-meta">Lv 0</div>
      </div>
      <div style="font-size:.75rem;color:var(--muted)">${def.desc||""}</div>
      <div class="bar-container">
        <div class="bar-fill" id="${def.id}-fill"></div>
        <div class="bar-label" id="${def.id}-label">Idle</div>
      </div>
    </div>
    <div class="row-right">
      <button class="small-btn" id="${def.id}-btn">${type==="skill"?"Train":"Work"}</button>
      <div class="small-label" id="${def.id}-info"></div>
    </div>
  `;
  return row;
}

skillDefs.forEach(def => skillBox.appendChild(makeRow(def,"skill")));
jobDefs.forEach(def => jobBox.appendChild(makeRow(def,"job")));

/* ---------------- GAME LOOP ---------------- */
function tick(dt) {
  state.time += dt;

  /* ---- SKILLS ---- */
  skillDefs.forEach(def=>{
    const s = state.skills[def.id];
    if (s.progress>0 && s.progress<1) {
      s.progress += dt / def.baseDuration;
      if (s.progress>=1) {
        s.progress=1;
        s.xp += def.xpPer;
        s.level += 1;   // FAST LEVELING
        floatText("LEVEL UP!", document.getElementById(def.id+"-fill").getBoundingClientRect());
        s.progress=0;
      }
    }
  });

  /* ---- JOBS ---- */
  jobDefs.forEach(def=>{
    const j = state.jobs[def.id];
    const unlocked = state.skills[def.req.skill].level >= def.req.lvl;
    if (!unlocked) return;

    if (j.progress>0 && j.progress<1) {
      j.progress += dt / def.baseDuration;
      if (j.progress>=1) {
        j.progress=1;
        const gain = def.reward * voidMult();
        if (def.id==="dust") state.dust += gain;
        if (def.id==="fragments") state.fragments += gain;
        floatText("+"+gain.toFixed(0), document.getElementById(def.id+"-fill").getBoundingClientRect());
        j.level += 1;
        j.progress=0;
      }
    }
  });

  render();
}

/* ---------------- RENDER ---------------- */
function render() {
  document.getElementById("time-display").textContent = "t="+Math.floor(state.time/1000)+"s";
  document.getElementById("dust-count").textContent = state.dust.toFixed(0);
  document.getElementById("fragment-count").textContent = state.fragments.toFixed(0);
  document.getElementById("void-favor-value").textContent = state.voidFavor.toFixed(0);
  document.getElementById("void-mult-value").textContent = "x"+voidMult().toFixed(2);

  skillDefs.forEach(def=>{
    const s = state.skills[def.id];
    document.getElementById(def.id+"-meta").textContent = "Lv "+s.level;
    const pct = s.progress*100;
    document.getElementById(def.id+"-fill").style.width = pct+"%";
    document.getElementById(def.id+"-label").textContent = pct>0?Math.floor(pct)+"%":"Idle";
    document.getElementById(def.id+"-info").textContent = "XP: "+s.xp;
  });

  jobDefs.forEach(def=>{
    const j = state.jobs[def.id];
    const unlocked = state.skills[def.req.skill].level >= def.req.lvl;
    const pct = j.progress*100;
    document.getElementById(def.id+"-fill").style.width = pct+"%";
    document.getElementById(def.id+"-label").textContent = unlocked?(pct>0?Math.floor(pct)+"%":"Idle"):"Locked";
    document.getElementById(def.id+"-meta").textContent = unlocked?"Lv "+j.level:"Locked";
    document.getElementById(def.id+"-btn").disabled = !unlocked;
  });
}

/* ---------------- BUTTONS ---------------- */
skillDefs.forEach(def=>{
  document.getElementById(def.id+"-btn").onclick = ()=>{
    const s = state.skills[def.id];
    if (s.progress===0) s.progress=0.0001;
  };
});

jobDefs.forEach(def=>{
  document.getElementById(def.id+"-btn").onclick = ()=>{
    const j = state.jobs[def.id];
    const unlocked = state.skills[def.req.skill].level >= def.req.lvl;
    if (!unlocked) return;
    if (j.progress===0) j.progress=0.0001;
  };
});

document.getElementById("feed-void-btn").onclick = ()=>{
  state.dust += 1 * voidMult();
  floatText("+1 Dust", document.getElementById("feed-void-btn").getBoundingClientRect());
};

/* ---------------- MAIN LOOP ---------------- */
let last = performance.now();
function loop(now){
  const dt = now-last;
  last = now;
  tick(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</div>
</body>
</html>
